<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- DevVault App Icon: Warm Espresso and Rust Keystone Vault -->
  <rect width="512" height="512" rx="112" fill="#171512" />
  <rect x="24" y="24" width="464" height="464" rx="88" stroke="#3c3730" stroke-width="4" stroke-opacity="0.6" fill="none" />
  
  <!-- Outer Chamfered Vault Boundary -->
  <path
    d="M148 64 h216 l96 96 v192 l-96 96 H148 l-96-96 V160 l96-96 z"
    stroke="#f1ece2"
    stroke-width="24"
    stroke-linejoin="round"
    fill="#211e1a"
  />

  <!-- Vault Door Arch (D Monogram) -->
  <path
    d="M176 144 v224 h88 a112 112 0 0 0 0-224 H176 z"
    stroke="#f1ece2"
    stroke-width="20"
    stroke-linejoin="round"
    fill="#f1ece2"
    fill-opacity="0.08"
  />

  <!-- Vault Locking Bolt (V Monogram) -->
  <path
    d="M256 244 L320 368 L384 244"
    stroke="#b6503a"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Tumbler Keystone -->
  <circle cx="256" cy="256" r="32" fill="#b6503a" />
  <circle cx="256" cy="256" r="14" fill="#171512" />
</svg>
